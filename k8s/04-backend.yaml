apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: plugins-data-pvc
  namespace: kraken
  labels:
    app.kubernetes.io/name: kraken-backend
    app.kubernetes.io/part-of: kraken-admin-tool
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: kraken
  labels:
    app.kubernetes.io/name: kraken-backend
    app.kubernetes.io/part-of: kraken-admin-tool
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kraken-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kraken-backend
        app.kubernetes.io/part-of: kraken-admin-tool
    spec:
      serviceAccountName: kraken-backend
      hostPID: true
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: kraken-config
            - secretRef:
                name: kraken-secrets
                optional: true
          command:
            - sh
            - -c
            - until pg_isready -h "${DB_HOST:-postgres}" -p "${DB_PORT:-5432}" -U "${DB_USER:-postgres}"; do sleep 2; done
      containers:
        - name: backend
          image: kraken-backend:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: kraken-config
            - secretRef:
                name: kraken-secrets
                optional: true
          volumeMounts:
            - name: plugins-data
              mountPath: /app/data/plugins
            - name: docker-sock
              mountPath: /var/run/docker.sock
            - name: host-root
              mountPath: /host
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: plugins-data
          persistentVolumeClaim:
            claimName: plugins-data-pvc
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
        - name: host-root
          hostPath:
            path: /
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: kraken
  labels:
    app.kubernetes.io/name: kraken-backend
    app.kubernetes.io/part-of: kraken-admin-tool
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kraken-backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
