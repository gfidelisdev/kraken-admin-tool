apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: kraken
  labels:
    app.kubernetes.io/name: kraken-frontend
    app.kubernetes.io/part-of: kraken-admin-tool
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kraken-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kraken-frontend
        app.kubernetes.io/part-of: kraken-admin-tool
    spec:
      containers:
        - name: frontend
          image: kraken-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: kraken-config
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: kraken
  labels:
    app.kubernetes.io/name: kraken-frontend
    app.kubernetes.io/part-of: kraken-admin-tool
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kraken-frontend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
