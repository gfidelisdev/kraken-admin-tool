apiVersion: v1
kind: ConfigMap
metadata:
  name: kraken-config
  namespace: kraken
  labels:
    app.kubernetes.io/part-of: kraken-admin-tool
data:
  # General runtime environment: "production" or "development"
  ENVIRONMENT: "production"

  # Runtime orchestrator mode: "kubernetes" or "docker"
  KRAKEN_RUNTIME_MODE: "kubernetes"

  # Target namespace where Kraken workloads run
  KRAKEN_NAMESPACE: "kraken"

  # Internal service ports for backend and frontend
  BACKEND_PORT: "8080"
  PORT: "3000"
  FRONTEND_PORT: "3000"

  # PostgreSQL database connection parameters
  # DB_HOST: host or Service name of the PostgreSQL instance (default: "postgres")
  DB_HOST: "postgres"
  # DB_PORT: port of the PostgreSQL instance (default: "5432")
  DB_PORT: "5432"
  # DB_USER: username for connecting to the database
  DB_USER: "kraken"
  # DB_NAME: name of the database to use
  DB_NAME: "kraken_db"
  # DB_SSLMODE: PostgreSQL SSL connection mode ("disable", "require", "verify-ca", "verify-full")
  DB_SSLMODE: "disable"

  # Credentials used by the PostgreSQL container itself during initialization
  POSTGRES_USER: "kraken"
  POSTGRES_DB: "kraken_db"

  # Docker daemon socket path (applicable when running in docker/hybrid mode)
  DOCKER_HOST: "unix:///var/run/docker.sock"

  # Filepath inside containers where plugins and runtime data are persisted
  PLUGINS_DIR: "/app/data/plugins"

  # Whether new user self-registration is allowed ("true" or "false")
  ALLOW_REGISTRATION: "false"

  # Internal backend API address reachable from the frontend container
  INTERNAL_API_URL: "http://backend:8080"

  # Public backend API URL accessed by client browsers (leave empty to use relative /api/ via reverse proxy)
  NEXT_PUBLIC_API_URL: ""

  # LocalStorage keys used by the frontend
  NEXT_PUBLIC_AUTH_TOKEN_STORAGE_KEY: "kraken_auth_token"
  NEXT_PUBLIC_ACTIVE_SERVER_STORAGE_KEY: "kraken_active_server_id"

  # Reverse proxy / edge ports exposed by the Nginx proxy
  HTTP_PORT: "8000"
  HTTPS_PORT: "8443"

  # Comma-separated list of Fully Qualified Domain Names (e.g. "kraken.example.com")
  KRAKEN_FQDNS: ""

  # Enable Kubernetes Ingress resource ("true" or "false")
  KRAKEN_INGRESS_ENABLED: "false"
---
apiVersion: v1
kind: Secret
metadata:
  name: kraken-secrets
  namespace: kraken
  labels:
    app.kubernetes.io/part-of: kraken-admin-tool
type: Opaque
stringData:
  # Database password used by the PostgreSQL container and backend connection.
  # Must match between POSTGRES_PASSWORD and DB_PASSWORD.
  # Provide a strong, random password.
  POSTGRES_PASSWORD: "CHANGE_ME_STRONG_DB_PASSWORD"
  DB_PASSWORD: "CHANGE_ME_STRONG_DB_PASSWORD"

  # JWT signing key and database encryption key.
  # Options:
  # 1. Leave empty ("") to auto-generate and persist cryptographically secure
  #    random keys on the plugins PVC at first boot.
  # 2. Or set explicit 32+ character high-entropy random strings.
  JWT_SECRET: ""
  ENCRYPTION_KEY: ""

  # Initial administrator account configuration.
  # Options:
  # 1. Leave INITIAL_ADMIN_PASSWORD empty ("") to configure the admin password
  #    interactively on the First-Time Setup screen (/setup).
  # 2. Or provide an initial password here for automated/unattended bootstrapping.
  INITIAL_ADMIN_PASSWORD: ""

  # Recovery key for administrative password resets or emergency access.
  # Leave empty or set a secure random string.
  ADMIN_RECOVERY_KEY: ""
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kraken-nginx-template
  namespace: kraken
  labels:
    app.kubernetes.io/part-of: kraken-admin-tool
data:
  default.conf.template: |
    # ==============================================================================
    # Kraken Admin Tool - Nginx Reverse Proxy Configuration Template
    # ==============================================================================
    # Dynamic environment variables:
    #   ${HTTP_PORT}  - Insecure HTTP port (automatically redirected to HTTPS)
    #   ${HTTPS_PORT} - Secure HTTPS port terminating TLS with self-signed cert
    # ==============================================================================

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # 1. HTTP Server: Enforce HTTPS Redirection
    server {
        listen 80;
        listen [::]:80;
        listen ${HTTP_PORT};
        listen [::]:${HTTP_PORT};
        server_name _;

        # Redirection to HTTPS preserving URI and targeting standard 443 or configured HTTPS port
        location / {
            if ($server_port = 80) {
                return 301 https://$host$request_uri;
            }
            return 301 https://$host:${HTTPS_PORT}$request_uri;
        }
    }

    # 2. HTTPS Server: SSL Termination & Internal Routing
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        listen ${HTTPS_PORT} ssl;
        listen [::]:${HTTPS_PORT} ssl;
        server_name _;

        # TLS Certificates
        ssl_certificate /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        # SSL Security Configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Backend API Endpoints (including WebSockets under /api/ws/)
        location /api/ {
            proxy_pass http://backend:8080/api/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port $server_port;

            # WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            client_max_body_size 50M;
        }

        # Backend Health Check
        location /health {
            proxy_pass http://backend:8080/health;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Frontend (Next.js 15 UI)
        location / {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port $server_port;

            # Next.js WebSockets / HMR
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            client_max_body_size 50M;
        }
    }
