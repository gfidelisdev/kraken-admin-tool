apiVersion: v1
kind: ServiceAccount
metadata:
  name: kraken-backend
  namespace: kraken
  labels:
    app.kubernetes.io/name: kraken-backend
    app.kubernetes.io/part-of: kraken-admin-tool
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kraken-admin-role
  labels:
    app.kubernetes.io/part-of: kraken-admin-tool
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - pods/status
      - pods/exec
      - services
      - endpoints
      - secrets
      - configmaps
      - persistentvolumeclaims
      - namespaces
      - nodes
      - events
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - deployments/scale
      - replicasets
      - statefulsets
      - daemonsets
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - ingresses/status
      - ingressclasses
      - networkpolicies
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kraken-admin-role-binding
  labels:
    app.kubernetes.io/part-of: kraken-admin-tool
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kraken-admin-role
subjects:
  - kind: ServiceAccount
    name: kraken-backend
    namespace: kraken
  - kind: ServiceAccount
    name: default
    namespace: kraken
  - kind: ServiceAccount
    name: default
    namespace: default
