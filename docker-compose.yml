services:
  # PostgreSQL Database for users, authentication, and audit logs
  postgres:
    image: postgres:16-alpine
    container_name: kraken-postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kraken-network

  # Go Backend Service (Chi Router, Docker SDK, Kubernetes Client-Go, GORM, WebSockets)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kraken-backend
    restart: unless-stopped
    privileged: true
    pid: host
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      # Host Docker daemon socket to inspect and manage Docker containers & images
      - /var/run/docker.sock:/var/run/docker.sock
      # Host root filesystem mounted read-only to allow scanning host directories
      - /:/host:ro
      # Host Kubeconfig to manage Kubernetes Pods & Deployments (optional, graceful fallback if absent)
      - ${HOME}/.kube/config:/home/kraken/.kube/config:ro
      # Persistent plugins storage
      - plugins_data:/app/data/plugins
    networks:
      - kraken-network

  # Next.js 15 Frontend (App Router, Tailwind CSS, shadcn/ui, WebSocket Live Log Terminal)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kraken-frontend
    restart: unless-stopped
    depends_on:
      - backend
    env_file:
      - .env
    networks:
      - kraken-network

  # Nginx Reverse Proxy (TLS Termination, HTTP->HTTPS Redirection, WebSocket Forwarding)
  proxy:
    image: nginx:alpine
    container_name: kraken-proxy
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    env_file:
      - .env
    ports:
      - "${HTTP_PORT}:${HTTP_PORT}"
      - "${HTTPS_PORT}:${HTTPS_PORT}"
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - kraken-network

volumes:
  postgres_data:
    driver: local
  plugins_data:
    driver: local

networks:
  kraken-network:
    driver: bridge
