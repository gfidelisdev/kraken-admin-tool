services:
  # PostgreSQL Database for users, authentication, and audit logs
  postgres:
    image: postgres:16-alpine
    container_name: kraken-postgres
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kraken}
      POSTGRES_DB: ${POSTGRES_DB:-kraken_db}
    entrypoint:
      - sh
      - -c
      - |
        if [ -z "$$POSTGRES_PASSWORD" ]; then
          export POSTGRES_HOST_AUTH_METHOD=trust
        fi
        exec docker-entrypoint.sh postgres
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-kraken} -d $${POSTGRES_DB:-kraken_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kraken-network

  # Go Backend Service (Chi Router, Docker SDK, Kubernetes Client-Go, GORM, WebSockets)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kraken-backend
    restart: unless-stopped
    privileged: true
    pid: host
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-kraken}
      DB_NAME: ${DB_NAME:-kraken_db}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      DOCKER_HOST: ${DOCKER_HOST:-unix:///var/run/docker.sock}
      PLUGINS_DIR: ${PLUGINS_DIR:-/app/data/plugins}
      BACKEND_PORT: ${BACKEND_PORT:-8080}
    volumes:
      # Host Docker daemon socket to inspect and manage Docker containers & images
      - /var/run/docker.sock:/var/run/docker.sock
      # Host root filesystem mounted read-only to allow scanning host directories
      - /:/host:ro
      # Host Kubeconfig to manage Kubernetes Pods & Deployments (optional, graceful fallback if absent)
      - ${HOME}/.kube/config:/home/kraken/.kube/config:ro
      # Persistent plugins storage
      - plugins_data:/app/data/plugins
    networks:
      - kraken-network

  # Next.js 15 Frontend (App Router, Tailwind CSS, shadcn/ui, WebSocket Live Log Terminal)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kraken-frontend
    restart: unless-stopped
    depends_on:
      - backend
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${FRONTEND_PORT:-3000}
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:8080}
    networks:
      - kraken-network

  # Nginx Reverse Proxy (TLS Termination, HTTP->HTTPS Redirection, WebSocket Forwarding)
  proxy:
    image: nginx:alpine
    container_name: kraken-proxy
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    env_file:
      - path: .env
        required: false
    environment:
      HTTP_PORT: ${HTTP_PORT:-8000}
      HTTPS_PORT: ${HTTPS_PORT:-8443}
    ports:
      - "${HTTP_PORT:-8000}:${HTTP_PORT:-8000}"
      - "${HTTPS_PORT:-8443}:${HTTPS_PORT:-8443}"
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - kraken-network

volumes:
  postgres_data:
    driver: local
  plugins_data:
    driver: local

networks:
  kraken-network:
    driver: bridge
